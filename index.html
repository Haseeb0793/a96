<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A-96 Operations</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="A-96 Ops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html, body { margin: 0; background: #000; }
  #a96-splash { position: fixed; inset: 0; z-index: 300; background: #000; display: grid; place-items: center; transition: opacity .3s ease; }
  #a96-splash.gone { opacity: 0; pointer-events: none; }
  #a96-splash img { display: block; width: 64px; height: auto; margin: 0 auto; }
  .a96-bar { width: 120px; height: 3px; margin: 30px auto 0; background: #222; border-radius: 3px; overflow: hidden; }
  .a96-bar i { display: block; width: 40%; height: 100%; background: #EA0B1B; animation: a96slide 1.1s ease-in-out infinite; }
  @keyframes a96slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #a96-msg { min-height: 20px; margin-top: 18px; padding: 0 28px; color: #A3A8B3; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; max-width: 340px; }
  #a96-msg button { margin-top: 12px; padding: 8px 18px; border: 0; border-radius: 10px; background: #EA0B1B; color: #fff; font: 600 14px system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { .a96-bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
<div id="a96-splash">
  <div>
    <img src="icons/logo-mark.svg" alt="A-96">
    <div class="a96-bar"><i></i></div>
    <div id="a96-msg"></div>
  </div>
</div>

<script>
  // ▼▼▼ Paste your Apps Script web app URL (the one ending in /exec) ▼▼▼
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwXxgFmhXl6GKVinuv7NGhATRYUTuIdz6Xf1sZYO0k8mTymXF3pJSXvo1gcGwQ8uGeqvg/exec';
  // ▲▲▲

  // The app's screens are kept on this device and shown instantly; the server is only asked for data.
  // It connects to Apps Script directly (no Google sign-in), so phones signed in to Google work too.
  (function () {
    const splash = document.getElementById('a96-splash'), msg = document.getElementById('a96-msg');
    window.A96_API = APP_URL.trim();

    function show(text, retry) {
      msg.textContent = text;
      if (retry) { const b = document.createElement('button'); b.textContent = 'Try again'; b.onclick = () => location.reload(); msg.appendChild(document.createElement('br')); msg.appendChild(b); }
    }

    // Small key-value store shared with the app (IndexedDB, falls back to localStorage).
    let dbp = null;
    function db() {
      if (!dbp) dbp = new Promise(res => { try { const r = indexedDB.open('a96', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
      return dbp;
    }
    function kvGet(k) {
      return db().then(d => {
        if (!d) { try { return JSON.parse(localStorage.getItem('a96.' + k) || 'null'); } catch (e) { return null; } }
        return new Promise(res => { try { const q = d.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } });
      });
    }
    function kvSet(k, v) {
      return db().then(d => {
        if (!d) { try { localStorage.setItem('a96.' + k, JSON.stringify(v)); } catch (e) {} return; }
        try { d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {}
      });
    }
    function api(fn, args) {
      return fetch(window.A96_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), credentials: 'omit', redirect: 'follow' })
        .then(r => r.text()).then(t => { const j = JSON.parse(t); if (!j.ok) throw new Error(j.error); return j.result; });
    }

    function mount(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.head.querySelectorAll('style, link[rel="stylesheet"], link[rel="preconnect"]').forEach(n => document.head.appendChild(document.importNode(n, true)));
      doc.querySelectorAll('script[src]').forEach(n => { const s = document.createElement('script'); s.src = n.getAttribute('src'); document.head.appendChild(s); });
      const inline = [];
      [].slice.call(doc.body.childNodes).forEach(n => {
        if (n.nodeName === 'SCRIPT') { if (!n.getAttribute('src')) inline.push(n.textContent); }
        else document.body.appendChild(document.importNode(n, true));
      });
      inline.forEach(t => { const s = document.createElement('script'); s.textContent = t; document.body.appendChild(s); });
      requestAnimationFrame(() => splash.classList.add('gone'));
    }

    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(window.A96_API)) {
      show('This app isn’t connected yet. Paste the web app URL into APP_URL in index.html.');
      return;
    }
    kvGet('shell').then(cached => {
      if (cached && cached.html) {
        mount(cached.html);
        // Check for a newer version in the background; it is used from the next open.
        setTimeout(() => api('getShell').then(s => { if (s && s.version !== cached.version) kvSet('shell', s); }).catch(() => {}), 1500);
        return;
      }
      const slow = setTimeout(() => show('Setting up the app on this device. This only happens once.'), 4000);
      api('getShell').then(s => { clearTimeout(slow); kvSet('shell', s); mount(s.html); })
        .catch(() => { clearTimeout(slow); show(navigator.onLine ? 'Couldn’t reach the A-96 server. Check that the web app is deployed with access "Anyone".' : 'No internet connection.', true); });
    });

    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  })();
</script>
</body>
</html>
